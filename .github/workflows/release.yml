name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0) — must match a CHANGELOG entry"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid version: '$version' (expected e.g. 2.0.0)"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version"

      - name: Verify version matches the app
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.version }}'
          $line = Select-String -Path src/timecapsule/__init__.py -Pattern 'VERSION = "(.+)"'
          $actual = $line.Matches[0].Groups[1].Value
          if ($actual -ne $expected) {
            Write-Error "VERSION in src/timecapsule/__init__.py is '$actual' but releasing '$expected'. Update it first."
            exit 1
          }

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            Write-Error "No CHANGELOG.md entry found for version $version. Add one before releasing."
            exit 1
          }
          $notes = $match.Groups[1].Value.Trim()
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          Write-Host "Release notes:`n$notes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: python build_release.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          # Create the tag if this was a manual dispatch without one
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            git tag $tag 2>$null
            git push origin $tag 2>$null
          }
          gh release create $tag `
            --title "Time Capsule $version" `
            --notes-file release_notes.md `
            "dist/TimeCapsule-Setup-$version.exe#TimeCapsule-Setup-$version.exe" `
            "dist/Time Capsule.exe#Time.Capsule.$version.portable.exe"
